<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Clock">
<meta name="theme-color" content="#0b1016">
<title>Home Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #0b1016; --tile: #141b24; --tile-2: #1a2330; --line: #233042;
  --fg: #e9eef4; --muted: #8492a5; --sun: #f3b649; --rain: #6aaef8;
  --font: "Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: absolute; width: 1366px; height: 1024px; transform-origin: 0 0; box-sizing: border-box; padding: 28px;
  display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(8, 1fr); gap: 16px; transition: opacity 2s; }
.t { background: var(--tile); border-radius: 28px; padding: 26px 30px; box-sizing: border-box; position: relative; overflow: hidden; }
.lbl { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

#clock { grid-column: 1 / 8; grid-row: 1 / 5; display: flex; flex-direction: column; justify-content: center; padding-left: 44px; }
#time { font-size: 220px; font-weight: 300; line-height: .9; letter-spacing: -.04em; }
#time .s { font-size: 54px; color: var(--muted); letter-spacing: 0; font-weight: 400; margin-left: 10px; }
#date { font-size: 36px; font-weight: 500; margin-top: 18px; }
#date span { color: var(--muted); font-weight: 400; }
#hk { font-size: 24px; color: var(--muted); margin-top: 10px; font-weight: 500; }
#hk b { color: var(--fg); font-weight: 600; }

#now { grid-column: 8 / 13; grid-row: 1 / 5; background: linear-gradient(160deg, #23324a 0%, #141b24 70%); }
#now .row1 { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
#now .row1 .ic { color: var(--sun); }
#now .temp { font-size: 128px; font-weight: 300; line-height: 1; letter-spacing: -.04em; }
#now .desc { font-size: 28px; font-weight: 500; margin-top: 2px; }
#now .hl { font-size: 22px; color: var(--muted); margin-top: 6px; }
#now .stats { position: absolute; left: 30px; right: 30px; bottom: 26px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
#now .stats b { display: block; color: var(--fg); font-size: 24px; font-weight: 600; margin-top: 4px; letter-spacing: 0; text-transform: none; }
#now .stats div { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

#hours { grid-column: 1 / 8; grid-row: 5 / 7; }
#hours .strip { display: grid; grid-template-columns: repeat(10, 1fr); margin-top: 8px; align-items: end; }
.h { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; color: var(--muted); }
.h .tv { color: var(--fg); font-size: 20px; font-weight: 600; }
.h .bar { width: 8px; border-radius: 4px; background: linear-gradient(var(--sun), #e07b39); }
.h.wet .bar { background: linear-gradient(var(--rain), #3f6fb5); }
.h .p { color: var(--rain); font-size: 13px; height: 16px; }
.h .ic { color: var(--fg); }

#photo { grid-column: 8 / 13; grid-row: 5 / 9; padding: 0; background: #000; }
#photo .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease; }
#photo .ph.on { opacity: 1; }
#photo .cap { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
#photo .cap span { background: rgba(8,12,18,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 14px; padding: 8px 14px; font-size: 18px; font-weight: 600; }
#photo .cap .w { color: #c9d3df; font-size: 15px; font-weight: 500; white-space: nowrap; }
#photo .cap span:empty { display: none; }
#photo .tag { position: absolute; top: 16px; right: 18px; font-size: 12px; color: #c9d3df; background: rgba(8,12,18,.55); padding: 4px 10px; border-radius: 10px; }
#days { position: absolute; left: 30px; right: 30px; bottom: 22px; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding-top: 14px; }
.dy { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 16px; color: var(--muted); font-weight: 600; }
.dy .ic { color: var(--fg); }
.dy .hi { color: var(--fg); font-size: 20px; } .dy .lo { color: var(--muted); font-weight: 500; } .dy .p { color: var(--rain); font-size: 13px; height: 15px; }

#home { grid-column: 1 / 5; grid-row: 7 / 9; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; padding: 0; background: transparent; }
.hb { border-radius: 22px; background: var(--tile); padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: var(--fg); }
.hb:active { background: #f6efe0; color: #1a1a1a; }
.hb .n { font-size: 17px; font-weight: 600; } .hb .v { font-size: 14px; color: var(--muted); }
.hb .ic { color: var(--sun); }

#news { grid-column: 5 / 8; grid-row: 7 / 9; }
.nh { display: flex; justify-content: space-between; align-items: center; }
.nw { margin-top: 10px; font-size: 18px; line-height: 1.32; font-weight: 500; }
.nw span { color: var(--muted); font-size: 12px; letter-spacing: .12em; display: block; font-weight: 600; margin-bottom: 2px; }
#play { font: 700 15px var(--font); background: var(--sun); color: #1a1a1a; border: 0; border-radius: 999px; padding: 8px 16px; white-space: nowrap; }
#play.on { background: var(--rain); }
#status { position: absolute; right: 36px; bottom: 6px; font-size: 11px; color: #3d4a5c; }
</style>
</head>
<body>
<div id="stage">
  <section class="t" id="clock"><div id="time" class="num"></div><div id="date"></div><div id="hk"></div></section>
  <section class="t" id="now"><div class="lbl">Loading weather…</div></section>
  <section class="t" id="hours"><div class="lbl">Next 10 hours</div><div class="strip" id="strip"></div></section>
  <section class="t" id="photo"><div class="cap"><span id="capT"></span><span class="w" id="capW"></span></div><div class="tag" id="ptag" hidden>示範相片 · sample</div></section>
  <section class="t" id="home"></section>
  <section class="t" id="news"><div class="nh"><div class="lbl">早晨新聞</div><button id="play" type="button" aria-label="Play Cantonese summary">▶ 播放</button></div><div id="nws"></div></section>
  <div id="status"></div>
</div>
<script>
/* ===== Settings you can change ===== */
var CONFIG = {
  city: 'London', lat: 51.5072, lon: -0.1276, timezone: 'Europe/London',
  secondCity: '香港', secondZone: 'Asia/Hong_Kong',
  // Each button runs an Apple Shortcut with exactly this name (make them in the Shortcuts app).
  home: [
    { name: 'Lights on', note: 'Living room', icon: 'light' },
    { name: 'Lights off', note: 'Whole home', icon: 'light' },
    { name: 'Good morning', note: 'Scene', icon: 'spark' },
    { name: 'Good night', note: 'Scene', icon: 'night' }
  ],
  dimFrom: 23, dimTo: 7          // screen dims between these hours
};
/* =================================== */

(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('lat')) { CONFIG.lat = +q.get('lat'); CONFIG.lon = +q.get('lon'); CONFIG.city = q.get('name') || ''; CONFIG.timezone = 'auto'; }
})();

var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function r(x) { return Math.round(x); }

var ICON = {
  sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  cloud: '<path d="M7 18.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 11a3.8 3.8 0 0 0 .8 7.5z"/>',
  partly: '<path d="M8.5 3.2v1.6M3.2 8.5h1.6M4.8 4.8l1.1 1.1M12.2 4.8l-1.1 1.1"/><path d="M5.6 11.3A3.4 3.4 0 0 1 11.6 7"/><path d="M8.5 20h9a3.6 3.6 0 0 0 .3-7.2 5.3 5.3 0 0 0-10.1 1A3.1 3.1 0 0 0 8.5 20z"/>',
  rain: '<path d="M7 15.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 8a3.8 3.8 0 0 0 .8 7.5z"/><path d="M8.5 18.2l-.9 2.3M12.5 18.2l-.9 2.3M16.5 18.2l-.9 2.3"/>',
  snow: '<path d="M7 15.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 8a3.8 3.8 0 0 0 .8 7.5z"/><path d="M8.5 19.5h.01M12.5 19.5h.01M16.5 19.5h.01"/>',
  storm: '<path d="M7 15.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 8a3.8 3.8 0 0 0 .8 7.5z"/><path d="M12.5 16.5l-2 3h3l-2 3"/>',
  fog: '<path d="M4 9h16M6 13h12M4 17h16"/>',
  night: '<path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/>',
  light: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  thermo: '<path d="M10 4a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0z"/><path d="M12 9v6"/>'
};
function icon(name, size, stroke) {
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (stroke || 1.6) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[name] || ICON.cloud) + '</svg>';
}

/* WMO weather code -> [icon, English, Cantonese] */
function wx(code, isDay) {
  var c = code;
  if (c <= 1) return [isDay === 0 ? 'night' : 'sun', c === 0 ? 'Clear' : 'Mostly clear', '天晴'];
  if (c === 2) return [isDay === 0 ? 'night' : 'partly', 'Partly cloudy', '部分時間有雲'];
  if (c === 3) return ['cloud', 'Cloudy', '多雲'];
  if (c === 45 || c === 48) return ['fog', 'Fog', '有霧'];
  if (c >= 51 && c <= 57) return ['rain', 'Drizzle', '有毛毛雨'];
  if (c >= 61 && c <= 67) return ['rain', c === 61 ? 'Light rain' : c === 65 ? 'Heavy rain' : 'Rain', c === 65 ? '有大雨' : '有雨'];
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return ['snow', 'Snow', '落雪'];
  if (c >= 80 && c <= 82) return ['rain', 'Showers', '有驟雨'];
  if (c >= 95) return ['storm', 'Thunderstorm', '有雷暴'];
  return ['cloud', '', ''];
}

/* ---------- fit the 1366x1024 design to the screen ---------- */
function fitStage() {
  var s = $('stage'), k = Math.min(innerWidth / 1366, innerHeight / 1024);
  s.style.transform = 'scale(' + k + ')';
  s.style.left = ((innerWidth - 1366 * k) / 2) + 'px';
  s.style.top = ((innerHeight - 1024 * k) / 2) + 'px';
}
addEventListener('resize', fitStage); fitStage();

/* ---------- clock ---------- */
function tick() {
  var d = new Date(), h = d.getHours();
  $('time').innerHTML = pad(h) + ':' + pad(d.getMinutes()) + '<span class="s">' + pad(d.getSeconds()) + '</span>';
  $('date').innerHTML = DAYS[d.getDay()] + ' <span>' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '</span>';
  try {
    $('hk').innerHTML = CONFIG.secondCity + ' <b class="num">' +
      d.toLocaleTimeString('en-GB', { timeZone: CONFIG.secondZone, hour: '2-digit', minute: '2-digit' }) + '</b> · ' +
      d.toLocaleDateString('zh-HK', { timeZone: CONFIG.secondZone, weekday: 'short' });
  } catch (e) { $('hk').innerHTML = ''; }
  var dim = CONFIG.dimFrom > CONFIG.dimTo ? (h >= CONFIG.dimFrom || h < CONFIG.dimTo) : (h >= CONFIG.dimFrom && h < CONFIG.dimTo);
  $('stage').style.opacity = dim ? '0.35' : '1';
  if (d.getSeconds() === 0) { // nudge a few pixels every minute against screen burn-in
    $('stage').style.marginLeft = (d.getMinutes() % 5 - 2) + 'px';
    $('stage').style.marginTop = (d.getMinutes() % 3 - 1) + 'px';
  }
}
tick(); setInterval(tick, 1000);

/* ---------- weather (Open-Meteo: free, no key) ---------- */
var W = null;
function loadWeather() {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day' +
    '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
    '&timezone=' + encodeURIComponent(CONFIG.timezone) + '&forecast_days=7';
  fetch(url).then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (d) { W = d; renderWeather(); $('status').textContent = 'Weather updated ' + new Date().toTimeString().slice(0, 5); })
    .catch(function (e) { $('status').textContent = 'Weather unavailable, retrying… (' + e.message + ')'; });
}
function renderWeather() {
  var c = W.current, dl = W.daily, now = wx(c.weather_code, c.is_day);
  $('now').innerHTML = '<div class="lbl">' + (CONFIG.city || 'Weather') + ' · now</div>' +
    '<div class="row1">' + icon(now[0], 96, 1.4) + '<div class="temp num">' + r(c.temperature_2m) + '°</div></div>' +
    '<div class="desc">' + now[1] + ' · feels ' + r(c.apparent_temperature) + '°</div>' +
    '<div class="hl">High ' + r(dl.temperature_2m_max[0]) + '° · Low ' + r(dl.temperature_2m_min[0]) + '° · Rain ' + (dl.precipitation_probability_max[0] || 0) + '% · Sunset ' + dl.sunset[0].slice(11) + '</div>' +
    '<div id="days"></div>';

  var h = W.hourly, key = c.time.slice(0, 13), start = 0;
  for (var i = 0; i < h.time.length; i++) if (h.time[i].slice(0, 13) === key) { start = i + 1; break; }
  var temps = h.temperature_2m.slice(start, start + 10), lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps), s = '';
  for (var j = start; j < start + 10 && j < h.time.length; j++) {
    var p = h.precipitation_probability[j] || 0, ht = 8 + (h.temperature_2m[j] - lo) / ((hi - lo) || 1) * 34;
    s += '<div class="h' + (p >= 40 ? ' wet' : '') + '"><span class="tv num">' + r(h.temperature_2m[j]) + '°</span><span class="bar" style="height:' + r(ht) + 'px"></span>' +
      icon(wx(h.weather_code[j], h.is_day[j])[0], 26) + '<span class="p">' + (p >= 10 ? p + '%' : '') + '</span><span class="num">' + h.time[j].slice(11, 13) + ':00</span></div>';
  }
  $('strip').innerHTML = s;

  s = '';
  for (var k = 1; k <= 5 && k < dl.time.length; k++) {
    var dd = new Date(dl.time[k] + 'T12:00'), pp = dl.precipitation_probability_max[k] || 0;
    s += '<div class="dy"><span>' + DAYS[dd.getDay()].slice(0, 3) + '</span>' + icon(wx(dl.weather_code[k], 1)[0], 30) +
      '<span class="num"><span class="hi">' + r(dl.temperature_2m_max[k]) + '°</span> <span class="lo">' + r(dl.temperature_2m_min[k]) + '°</span></span>' +
      '<span class="p">' + (pp >= 20 ? pp + '%' : '') + '</span></div>';
  }
  $('days').innerHTML = s;
}
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

/* ---------- family photos ----------
   photos.json next to this page: [{"src":"photos/beach.jpg","text":"Brighton day out","when":"Oct 2026"}]
   Until it has photos, painted sample scenes stand in. */
function paint(fn) { var c = document.createElement('canvas'); c.width = 1200; c.height = 1000; var g = c.getContext('2d'); fn(g, 1200, 1000); return c.toDataURL('image/jpeg', 0.85); }
  function grad(g, h, stops) { var l = g.createLinearGradient(0, 0, 0, h); stops.forEach(function (s) { l.addColorStop(s[0], s[1]); }); return l; }
function hills(g, w, h, base, amp, freq, phase, color) {
  g.fillStyle = color; g.beginPath(); g.moveTo(0, h);
  for (var x = 0; x <= w; x += 10) g.lineTo(x, base + Math.sin(x / freq + phase) * amp + Math.sin(x / (freq * .37) + phase * 2) * amp * .3);
  g.lineTo(w, h); g.closePath(); g.fill();
}
var SCENES = [
  { text: '維港日落，記得我哋上次一齊睇', when: '10月20日', draw: function (g, w, h) {
    g.fillStyle = grad(g, h * .62, [[0, '#2c2350'], [.5, '#c4566a'], [1, '#f4a35c']]); g.fillRect(0, 0, w, h * .62);
    g.fillStyle = '#ffd9a0'; g.beginPath(); g.arc(w * .62, h * .55, 70, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1d1a2e';
    for (var x = 0; x < w; x += 46) { var bh = 40 + Math.abs(Math.sin(x * 7.3)) * 170; g.fillRect(x, h * .62 - bh, 40, bh); }
    g.fillStyle = grad(g, h, [[0, '#7a3d55'], [.7, '#2a2038'], [1, '#161222']]); g.fillRect(0, h * .62, w, h * .38);
    g.fillStyle = 'rgba(255,214,150,.55)';
    for (var y = h * .64; y < h; y += 14) { var ww = 30 + Math.random() * 120; g.fillRect(w * .62 - ww / 2 + (Math.random() - .5) * 40, y, ww, 3); }
  } },
  { text: 'Hampstead Heath 散步，好多落葉', when: '10月27日', draw: function (g, w, h) {
    g.fillStyle = grad(g, h, [[0, '#8fb6d8'], [.55, '#dfe6e0'], [1, '#dfe6e0']]); g.fillRect(0, 0, w, h);
    hills(g, w, h, h * .52, 30, 260, 1, '#a7b38c');
    hills(g, w, h, h * .62, 40, 200, 2.4, '#7f8f5e');
    hills(g, w, h, h * .76, 50, 330, .3, '#a8662f');
    hills(g, w, h, h * .9, 30, 150, 4, '#6d3e1f');
    for (var i = 0; i < 9; i++) { var tx = 120 + i * 180 + Math.sin(i) * 40, ty = h * .6 + Math.cos(i) * 20;
      g.fillStyle = '#4a3423'; g.fillRect(tx - 6, ty, 12, 70);
      g.fillStyle = ['#d4762c', '#e2a33b', '#b9512a'][i % 3]; g.beginPath(); g.arc(tx, ty - 10, 48, 0, Math.PI * 2); g.fill(); }
  } },
  { text: '湖區行山，天氣好好', when: '9月14日', draw: function (g, w, h) {
    g.fillStyle = grad(g, h, [[0, '#f2c9a8'], [.45, '#e7a5a0'], [1, '#6e6a93']]); g.fillRect(0, 0, w, h);
    function peaks(base, color, seed) { g.fillStyle = color; g.beginPath(); g.moveTo(0, h);
      for (var x = 0; x <= w; x += 80) g.lineTo(x, base - Math.abs(Math.sin(x / 210 + seed)) * 220 - Math.abs(Math.sin(x / 90 + seed)) * 40);
      g.lineTo(w, h); g.fill(); }
    peaks(h * .62, '#9b86a6', 1); peaks(h * .76, '#6c5f87', 3); peaks(h * .92, '#3d3a5c', 5);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(0, h * .88, w, h * .12);
  } },
  { text: '屋企附近嘅夜景', when: '11月1日', draw: function (g, w, h) {
    g.fillStyle = grad(g, h, [[0, '#0b1230'], [.7, '#24305c'], [1, '#2f3d6b']]); g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff';
    for (var i = 0; i < 160; i++) { g.globalAlpha = Math.random() * .8; g.fillRect(Math.random() * w, Math.random() * h * .5, 2, 2); }
    g.globalAlpha = 1; g.fillStyle = '#f6eed2'; g.beginPath(); g.arc(w * .22, h * .2, 54, 0, Math.PI * 2); g.fill();
    for (var x = 0; x < w; x += 120) { var bh = 200 + Math.abs(Math.sin(x * 3.1)) * 380; g.fillStyle = '#121a36'; g.fillRect(x, h - bh, 110, bh);
      for (var yy = h - bh + 20; yy < h - 20; yy += 34) for (var xx = x + 12; xx < x + 100; xx += 24) if (Math.random() > .55) { g.fillStyle = Math.random() > .3 ? '#f7cf7a' : '#9fd0ff'; g.fillRect(xx, yy, 12, 16); } }
  } }
];
var PHOTOS = [], pIdx = -1;
function startPhotos(list) {
  PHOTOS = list; var box = $('photo');
  PHOTOS.forEach(function (p) { var d = document.createElement('div'); d.className = 'ph'; d.style.backgroundImage = 'url("' + p.src + '")'; box.insertBefore(d, box.firstChild); });
  nextPhoto(); setInterval(nextPhoto, 20000);
}
function nextPhoto() {
  var els = $('photo').querySelectorAll('.ph'); if (!els.length) return;
  if (pIdx >= 0) els[pIdx].classList.remove('on');
  pIdx = (pIdx + 1) % els.length; els[pIdx].classList.add('on');
  var p = PHOTOS[els.length - 1 - pIdx] || {}; $('capT').textContent = p.text || ''; $('capW').textContent = p.when || '';
}
fetch('photos.json?t=' + Date.now()).then(function (r) { return r.json(); })
  .then(function (list) { if (list && list.length) startPhotos(list); else throw 0; })
  .catch(function () { $('ptag').hidden = false; startPhotos(SCENES.map(function (sc) { return { src: paint(sc.draw), text: sc.text, when: sc.when }; })); });

/* ---------- Home buttons (run Apple Shortcuts) ---------- */
$('home').innerHTML = CONFIG.home.map(function (b) {
  return '<a class="hb" href="shortcuts://run-shortcut?name=' + encodeURIComponent(b.name) + '">' + icon(b.icon, 30) +
    '<div><div class="n">' + b.name + '</div><div class="v">' + b.note + '</div></div></a>';
}).join('');

/* ---------- headlines (news.json is refreshed by the GitHub Action) ---------- */
var NEWS = [], newsAt = 0;
function loadNews() {
  fetch('news.json?t=' + Date.now()).then(function (r) { return r.json(); })
    .then(function (d) { NEWS = (d.items || []).filter(function (n) { return n.t; }); showNews(); })
    .catch(function () { if (!NEWS.length) $('nws').innerHTML = '<div class="nw"><span>新聞</span>暫時未有新聞</div>'; });
}
function showNews() {
  if (!NEWS.length) return;
  var out = '';
  for (var i = 0; i < 2 && i < NEWS.length; i++) { var n = NEWS[(newsAt + i) % NEWS.length]; out += '<div class="nw"><span>' + n.src + '</span>' + n.t + '</div>'; }
  $('nws').innerHTML = out;
  newsAt = (newsAt + 2) % NEWS.length;
}
loadNews(); setInterval(loadNews, 30 * 60 * 1000); setInterval(showNews, 15000);

/* ---------- Cantonese spoken summary ---------- */
function brief() {
  var d = new Date(), h = d.getHours();
  var t = (h < 12 ? '早晨。' : h < 18 ? '午安。' : '晚安。') + (CONFIG.city === 'London' ? '倫敦' : '') + '而家係' + h + '點' + (d.getMinutes() ? d.getMinutes() + '分' : '正') + '。';
  if (W) {
    var c = W.current, dl = W.daily;
    t += '今日天氣' + wx(dl.weather_code[0], 1)[2] + '，而家' + r(c.temperature_2m) + '度，最高' + r(dl.temperature_2m_max[0]) + '度，最低' + r(dl.temperature_2m_min[0]) + '度，下雨機會百分之' + (dl.precipitation_probability_max[0] || 0) + '。';
    t += '聽日' + wx(dl.weather_code[1], 1)[2] + '，' + r(dl.temperature_2m_min[1]) + '至' + r(dl.temperature_2m_max[1]) + '度。';
  }
  if (NEWS.length) t += '新聞摘要。' + NEWS.slice(0, 6).map(function (n) { return n.src + '：' + n.t + '。'; }).join('');
  return t;
}
function voice() {
  var v = speechSynthesis.getVoices().filter(function (x) { return /zh[-_]HK|yue/i.test(x.lang); });
  return v[0] || null;
}
$('play').addEventListener('click', function () {
  var b = $('play');
  if (!window.speechSynthesis) { b.textContent = '不支援'; return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); b.classList.remove('on'); b.textContent = '▶ 播放'; return; }
  var u = new SpeechSynthesisUtterance(brief());
  u.lang = 'zh-HK'; u.rate = 0.95; var v = voice(); if (v) u.voice = v;
  u.onend = u.onerror = function () { b.classList.remove('on'); b.textContent = '▶ 播放'; };
  b.classList.add('on'); b.textContent = '■ 停止';
  speechSynthesis.speak(u);
});

/* Reload every 6 hours so the page stays fresh and light. */
setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
</script>
