<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Clock">
<meta name="theme-color" content="#0b1016">
<title>Home Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #0b1016; --tile: #141b24; --tile-2: #1a2330; --line: #233042;
  --fg: #e9eef4; --muted: #8492a5; --sun: #f3b649; --rain: #6aaef8;
  --font: "Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
/* Pages sit side by side; swipe left/right (or tap the dots) to move between them. */
#pages { position: absolute; inset: 0; overflow: hidden; transition: opacity 2s; }
#track { position: absolute; top: 0; left: 0; height: 100%; display: flex; transition: transform .45s cubic-bezier(.2,.8,.2,1); will-change: transform; }
#track.drag { transition: none; }
.page { position: relative; width: 100vw; height: 100%; flex: none; overflow: hidden; }
.stage { position: absolute; width: 1366px; height: 1024px; transform-origin: 0 0; box-sizing: border-box; }
#stage { padding: 28px; display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(8, 1fr); gap: 16px; }
#dots { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
#dots button { width: 34px; height: 26px; border: 0; padding: 0; background: none; display: flex; align-items: center; justify-content: center; }
#dots button i { width: 8px; height: 8px; border-radius: 50%; background: #3d4a5c; transition: background .3s, width .3s; }
#dots button.on i { background: #8492a5; width: 22px; border-radius: 4px; }

/* ----- page 2: analog clock (dusty pink, square face, engraved numbers) ----- */
#p2 { background: radial-gradient(ellipse at 35% 25%, #dcbcb9 0%, #cfaba8 60%, #c29d9b 100%); }
#big { position: absolute; inset: 0; }
#face { position: absolute; border-radius: 19%; background: linear-gradient(150deg, #e6cac7 0%, #dcbcb9 55%, #d2b0ad 100%);
  box-shadow: 0 30px 70px rgba(90,40,40,.22), 0 4px 14px rgba(90,40,40,.12), inset 0 2px 2px rgba(255,245,242,.6), inset 0 -3px 6px rgba(120,70,70,.12); }
#face .n { position: absolute; width: 2em; height: 1.2em; margin: -.6em 0 0 -1em; display: flex; align-items: center; justify-content: center;
  font-weight: 400; line-height: 1; letter-spacing: -.02em; color: #d7b5b2;
  text-shadow: -.015em -.015em .02em rgba(110,60,60,.38), .02em .02em .02em rgba(255,244,240,.9), 0 0 1px rgba(100,50,50,.3); }
#face svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#big .info { position: absolute; font-size: 26px; font-weight: 600; color: rgba(107,42,42,.55); letter-spacing: .02em; line-height: 1.35; }
#big .info b { font-weight: 700; color: rgba(107,42,42,.75); }
#binfoL { left: 40px; bottom: 44px; }
#binfoR { right: 40px; bottom: 44px; text-align: right; }
body.p2 #dots button i { background: rgba(107,42,42,.25); }
body.p2 #dots button.on i { background: rgba(107,42,42,.55); }

/* ----- page 3: Premier League table ----- */
#league { padding: 34px 40px 64px; display: flex; flex-direction: column; }
#league .top { display: flex; align-items: baseline; justify-content: space-between; padding: 0 8px 18px; }
#league h1 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -.01em; }
#league h1 span { color: var(--muted); font-weight: 400; font-size: 30px; margin-left: 12px; }
#league .upd { font-size: 17px; color: var(--muted); font-weight: 500; }
#ltab { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.lcol { background: var(--tile); border-radius: 28px; padding: 14px 22px; display: flex; flex-direction: column; }
.lr { flex: 1; display: grid; grid-template-columns: 44px 44px 1fr 52px 62px 70px; align-items: center; gap: 6px; font-size: 26px; border-bottom: 1px solid var(--line); }
.lr:last-child { border-bottom: 0; }
.lr.hd { flex: none; height: 40px; font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.lr .pos { color: var(--muted); font-weight: 600; text-align: center; border-radius: 10px; padding: 4px 0; font-size: 22px; }
.lr.cl .pos { background: rgba(106,174,248,.18); color: var(--rain); }
.lr.rel .pos { background: rgba(240,98,98,.16); color: #f07a7a; }
.lr .bd { width: 34px; height: 34px; object-fit: contain; }
.lr .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.lr .pts { text-align: right; font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; }
.lr.hd .n, .lr.hd .pts { font-size: 13px; font-weight: 600; color: var(--muted); }
#lmsg { grid-column: 1 / 3; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--muted); }
.t { background: var(--tile); border-radius: 28px; padding: 26px 30px; box-sizing: border-box; position: relative; overflow: hidden; }
.lbl { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

#clock { grid-column: 1 / 8; grid-row: 1 / 5; display: flex; flex-direction: column; justify-content: center; padding-left: 44px; }
#time { font-size: 220px; font-weight: 300; line-height: .9; letter-spacing: -.04em; }
#time .s { font-size: 54px; color: var(--muted); letter-spacing: 0; font-weight: 400; margin-left: 10px; }
#date { font-size: 36px; font-weight: 500; margin-top: 18px; }
#date span { color: var(--muted); font-weight: 400; }
#hk { font-size: 24px; color: var(--muted); margin-top: 10px; font-weight: 500; }
#hk b { color: var(--fg); font-weight: 600; }
#indoor { position: absolute; bottom: 26px; right: 30px; text-align: right; }
#indoor .v { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 56px; font-weight: 300; line-height: 1; letter-spacing: -.02em; margin-top: 6px; }
#indoor .v .ic { color: var(--sun); }
#indoor .m { font-size: 15px; color: var(--muted); margin-top: 6px; font-weight: 500; }
#indoor.old .v { color: var(--muted); } #indoor.old .v .ic { color: var(--muted); }
#heat { position: absolute; bottom: 26px; left: 44px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1a1a1a; background: var(--sun); border-radius: 999px; padding: 12px 24px 12px 16px; font-size: 22px; font-weight: 700; }
#clock { padding-bottom: 96px; }   /* room for the warm-up button */
#heat .ic { flex: none; }
#heat small { font-size: 15px; font-weight: 600; opacity: .7; }
#heat:active { background: #f6efe0; }
#heat.sent { background: var(--tile-2); color: var(--fg); }

#now { grid-column: 8 / 13; grid-row: 1 / 5; background: linear-gradient(160deg, #23324a 0%, #141b24 70%); }
#now .row1 { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
#now .row1 .ic { color: var(--sun); }
#now .temp { font-size: 128px; font-weight: 300; line-height: 1; letter-spacing: -.04em; }
#now .desc { font-size: 28px; font-weight: 500; margin-top: 2px; }
#now .hl { font-size: 22px; color: var(--muted); margin-top: 6px; }
#now .stats { position: absolute; left: 30px; right: 30px; bottom: 26px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
#now .stats b { display: block; color: var(--fg); font-size: 24px; font-weight: 600; margin-top: 4px; letter-spacing: 0; text-transform: none; }
#now .stats div { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

#hours { grid-column: 1 / 5; grid-row: 5 / 7; padding: 22px 20px 22px 24px; }
#hours .h { font-size: 13px; }
#hours .h .tv { font-size: 18px; }
#hours .strip { display: grid; grid-template-columns: repeat(10, 1fr); margin-top: 8px; align-items: end; }
.h { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; color: var(--muted); }
.h .tv { color: var(--fg); font-size: 20px; font-weight: 600; }
.h .bar { width: 8px; border-radius: 4px; background: linear-gradient(var(--sun), #e07b39); }
.h.wet .bar { background: linear-gradient(var(--rain), #3f6fb5); }
.h .p { color: var(--rain); font-size: 13px; height: 16px; }
.h .ic { color: var(--fg); }

#photo { grid-column: 8 / 13; grid-row: 7 / 9; padding: 0; background: #000; }

/* calendar: upcoming events from calendar.json (saved by .github/workflows/calendar.yml) */
#cal { grid-column: 8 / 13; grid-row: 5 / 7; padding: 22px 26px; }
#cal .ch { display: flex; justify-content: space-between; align-items: baseline; }
#cal .ch .sm { font-size: 12px; color: #c9d3df; background: var(--tile-2); padding: 3px 9px; border-radius: 9px; }
#evs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; margin-top: 10px; }
.ecol { min-width: 0; }
.eday { font-size: 14px; font-weight: 700; color: var(--sun); margin: 2px 0 4px; letter-spacing: .02em; }
.eday.later { color: var(--muted); }
.ev { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 19px; line-height: 1.2; }
.ev:last-child { border-bottom: 0; }
.ev i { flex: none; width: 4px; height: 18px; border-radius: 2px; align-self: center; }
.ev .tm { flex: none; width: 50px; color: var(--muted); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ev .ti { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ev.now .tm { color: var(--sun); }
.ev.past { opacity: .45; }
.enone { font-size: 18px; color: var(--muted); padding: 6px 0; }
#photo .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease; }
#photo .ph.on { opacity: 1; }
#photo .cap { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
#photo .cap span { background: rgba(8,12,18,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 14px; padding: 8px 14px; font-size: 18px; font-weight: 600; }
#photo .cap .w { color: #c9d3df; font-size: 15px; font-weight: 500; white-space: nowrap; }
#photo .cap span:empty { display: none; }
#photo .tag { position: absolute; top: 16px; right: 18px; font-size: 12px; color: #c9d3df; background: rgba(8,12,18,.55); padding: 4px 10px; border-radius: 10px; }
#days { position: absolute; left: 30px; right: 30px; bottom: 22px; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding-top: 14px; }
.dy { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 16px; color: var(--muted); font-weight: 600; }
.dy .ic { color: var(--fg); }
.dy .hi { color: var(--fg); font-size: 20px; } .dy .lo { color: var(--muted); font-weight: 500; } .dy .p { color: var(--rain); font-size: 13px; height: 15px; }

#apps { grid-column: 5 / 8; grid-row: 5 / 7; display: grid; grid-template-rows: 1fr 1fr; gap: 16px; padding: 0; background: transparent; }
.app { border-radius: 28px; display: flex; flex-direction: row; justify-content: flex-start; align-items: center; gap: 18px; padding: 0 24px; text-decoration: none; color: var(--fg); }
.app:active { background: #f6efe0 !important; color: #1a1a1a; }
.app.sp { background: linear-gradient(160deg, #1a3a28 0%, #141b24 80%); }
.app.yt { background: linear-gradient(160deg, #3d1a1a 0%, #141b24 80%); }
.app .dot { flex: none; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.app.sp .dot { background: #1db954; color: #0b1016; }
.app.yt .dot { background: #ff0033; color: #fff; border-radius: 18px; width: 82px; }
.app .n { font-size: 24px; font-weight: 600; }
.app .dot svg { width: 30px; height: 30px; }

#news { grid-column: 1 / 8; grid-row: 7 / 9; padding: 16px 28px; }
#news #play { padding: 6px 14px; font-size: 14px; }
.nh { display: flex; justify-content: space-between; align-items: center; }
#nws { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; margin-top: 6px; }
.ncol { min-width: 0; }
.nw { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.3; font-weight: 500; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.nw:last-child { border-bottom: 0; }
.nw span { color: var(--sun); font-size: 11px; letter-spacing: .1em; font-weight: 700; margin-right: 8px; }
.ncol.en .nw span { color: var(--rain); }
#play { font: 700 15px var(--font); background: var(--sun); color: #1a1a1a; border: 0; border-radius: 999px; padding: 8px 16px; white-space: nowrap; }
#play.on { background: var(--rain); }
#status { position: absolute; right: 36px; bottom: 6px; font-size: 11px; color: #3d4a5c; }
</style>
</head>
<body>
<div id="pages"><div id="track">
<div class="page" id="p1">
<div class="stage" id="stage">
  <section class="t" id="clock"><div id="time" class="num"></div><div id="date"></div><div id="hk"></div><div id="indoor" hidden></div><a id="heat" href="#"></a></section>
  <section class="t" id="now"><div class="lbl">Loading weather…</div></section>
  <section class="t" id="hours"><div class="lbl">Next 10 hours</div><div class="strip" id="strip"></div></section>
  <section class="t" id="cal"><div class="ch"><div class="lbl">日程 · Calendar</div><span class="sm" id="ctag" hidden>示範 · sample</span></div><div id="evs"></div></section>
  <section class="t" id="photo"><div class="cap"><span id="capT"></span><span class="w" id="capW"></span></div><div class="tag" id="ptag" hidden>示範相片 · sample</div></section>
  <section class="t" id="apps"><a class="app sp" href="spotify:"><span class="dot"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></span><span class="n">Spotify</span></a><a class="app yt" href="youtube://"><span class="dot"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></span><span class="n">YouTube</span></a></section>
  <section class="t" id="news"><div class="nh"><div class="lbl">新聞 · News</div><button id="play" type="button" aria-label="Play Cantonese summary">▶ 播放</button></div><div id="nws"></div></section>
  <div id="status"></div>
</div>
</div>
<div class="page" id="p2">
<div id="big">
  <div id="face">
    <div id="bnums"></div>
    <svg viewBox="0 0 1000 1000" aria-hidden="true">
      <defs>
        <filter id="hs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#5a2626" flood-opacity=".35"/></filter>
        <filter id="ss" x="-50%" y="-10%" width="200%" height="120%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#5a2626" flood-opacity=".3"/></filter>
      </defs>
      <g id="hh" filter="url(#hs)"><rect x="-5" y="-55" width="10" height="60" rx="5" fill="#6b2a2a"/><rect x="-16" y="-245" width="32" height="200" rx="16" fill="#6b2a2a"/></g>
      <g id="mh" filter="url(#hs)"><rect x="-5" y="-55" width="10" height="60" rx="5" fill="#6b2a2a"/><rect x="-14" y="-355" width="28" height="310" rx="14" fill="#6b2a2a"/></g>
      <circle cx="500" cy="500" r="13" fill="#6b2a2a"/>
      <g id="sh" filter="url(#ss)"><rect x="-2.5" y="-380" width="5" height="450" rx="2.5" fill="#ef4fc9"/><circle r="10" fill="#ef4fc9"/><circle r="4.5" fill="#f6dfe9"/></g>
    </svg>
  </div>
  <div class="info" id="binfoL"></div>
  <div class="info" id="binfoR"></div>
</div>
</div>
<div class="page" id="p3">
<div class="stage" id="league">
  <div class="top"><h1>Premier League<span>英超積分榜</span></h1><div class="upd" id="lupd"></div></div>
  <div id="ltab"><div id="lmsg">Loading table… 載入中</div></div>
</div>
</div>
</div></div>
<div id="dots"></div>
<script>
/* ===== Settings you can change ===== */
var CONFIG = {
  city: 'Northwood', cityZh: '倫敦 Northwood ', lat: 51.6111, lon: -0.4237, timezone: 'Europe/London',
  // Warm-up button on the clock: runs this Apple Shortcut on the iPad (see README).
  // The temperature itself is set in the Shortcut / Home scene; 'temp' is only the label.
  heat: { shortcut: 'Warm Up Home', temp: 21 },
  secondCity: '香港', secondZone: 'Asia/Hong_Kong',
  dimFrom: 23, dimTo: 7          // screen dims between these hours
};
/* =================================== */

(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('lat')) { CONFIG.lat = +q.get('lat'); CONFIG.lon = +q.get('lon'); CONFIG.city = q.get('name') || ''; CONFIG.timezone = 'auto'; }
})();

var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function r(x) { return Math.round(x); }

var ICON = {
  sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  cloud: '<path d="M7 18.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 11a3.8 3.8 0 0 0 .8 7.5z"/>',
  partly: '<path d="M8.5 3.2v1.6M3.2 8.5h1.6M4.8 4.8l1.1 1.1M12.2 4.8l-1.1 1.1"/><path d="M5.6 11.3A3.4 3.4 0 0 1 11.6 7"/><path d="M8.5 20h9a3.6 3.6 0 0 0 .3-7.2 5.3 5.3 0 0 0-10.1 1A3.1 3.1 0 0 0 8.5 20z"/>',
  rain: '<path d="M7 15.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 8a3.8 3.8 0 0 0 .8 7.5z"/><path d="M8.5 18.2l-.9 2.3M12.5 18.2l-.9 2.3M16.5 18.2l-.9 2.3"/>',
  snow: '<path d="M7 15.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 8a3.8 3.8 0 0 0 .8 7.5z"/><path d="M8.5 19.5h.01M12.5 19.5h.01M16.5 19.5h.01"/>',
  storm: '<path d="M7 15.5h10.2a4.1 4.1 0 0 0 .4-8.2A6 6 0 0 0 6.2 8a3.8 3.8 0 0 0 .8 7.5z"/><path d="M12.5 16.5l-2 3h3l-2 3"/>',
  fog: '<path d="M4 9h16M6 13h12M4 17h16"/>',
  night: '<path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/>',
  light: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  thermo: '<path d="M10 4a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0z"/><path d="M12 9v6"/>',
  flame: '<path d="M12 21.5c-3.9 0-6.5-2.6-6.5-6.2 0-3.2 2.2-5.3 3.6-7.4.4 1.9 1.4 3 2.4 3.5-.3-3.3 1.2-6.6 3.8-8.4-.2 2.6.8 4.6 2.3 6.4 1.3 1.6 2.4 3.4 2.4 5.9 0 3.6-2.8 6.2-6.5 6.2z"/>'
};
function icon(name, size, stroke) {
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (stroke || 1.6) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[name] || ICON.cloud) + '</svg>';
}

/* WMO weather code -> [icon, English, Cantonese] */
function wx(code, isDay) {
  var c = code;
  if (c <= 1) return [isDay === 0 ? 'night' : 'sun', c === 0 ? 'Clear' : 'Mostly clear', '天晴'];
  if (c === 2) return [isDay === 0 ? 'night' : 'partly', 'Partly cloudy', '部分時間有雲'];
  if (c === 3) return ['cloud', 'Cloudy', '多雲'];
  if (c === 45 || c === 48) return ['fog', 'Fog', '有霧'];
  if (c >= 51 && c <= 57) return ['rain', 'Drizzle', '有毛毛雨'];
  if (c >= 61 && c <= 67) return ['rain', c === 61 ? 'Light rain' : c === 65 ? 'Heavy rain' : 'Rain', c === 65 ? '有大雨' : '有雨'];
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return ['snow', 'Snow', '落雪'];

/* ---------- pages: swipe left/right, tap the dots, or use the arrow keys ----------

var PAGE = 0;
(function () {
  var track = $('track'), pages = track.children, n = pages.length, dots = $('dots');

    b.onclick = (function (k) { return function () { goPage(k); }; })(i);

    track.style.transform = 'translate3d(' + (-PAGE * innerWidth) + 'px,0,0)';
    if (instant) { track.offsetWidth; track.classList.remove('drag'); }
    for (var j = 0; j < n; j++) dots.children[j].className = j === PAGE ? 'on' : '';

  };
  var start = +new URLSearchParams(location.search).get('page') - 1;
  if (!(start >= 0)) { try { start = +localStorage.getItem('page') || 0; } catch (e) { start = 0; } }
  goPage(start, true);

  var x0 = null, y0 = 0, t0 = 0, dx = 0, horiz = null;
  document.addEventListener('touchstart', function (e) {

  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (x0 === null) return;

    if (horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horiz = Math.abs(dx) > Math.abs(dy);
    if (!horiz) return;
    e.preventDefault();
    if ((PAGE === 0 && dx > 0) || (PAGE === n - 1 && dx < 0)) dx /= 3;   // gentle stretch at the ends

})();

/* ---------- calendar ----------

  }

  var right = '', used = 0;
  order.forEach(function (k) {
    if (k === tk || used >= MAX - 1) return;
    var list = groups[k].sort(function (a, b) { return (b.e.allDay - a.e.allDay) || (a.s - b.s); }).slice(0, MAX - 1 - used);
    right += '<div class="eday' + (right ? ' later' : '') + '">' + label(k) + '</div>' + list.map(row).join('');
    used += list.length + 1;
  });
  if (!right) right = '<div class="eday later">之後 Coming up</div><div class="enone">未來兩星期冇嘢</div>';
  $('evs').innerHTML = '<div class="ecol">' + left + '</div><div class="ecol">' + right + '</div>';
}
loadCal(); setInterval(loadCal, 15 * 60 * 1000); setInterval(showCal, 60 * 1000);

/* ---------- indoor temperature ----------
   home.json is written by .github/workflows/home-temp.yml when the
   "Send home temp" Shortcut posts a reading from Apple Home:
   {"temp": 21.5, "hum": 48, "at": "2026-11-15T19:30:00Z"}  (hum is optional) */
var HOME = null;
function loadHome() {
  fetch('home.json?t=' + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { if (typeof d.temp !== 'number') throw 0; HOME = d; showHome(); })
    .catch(function () { HOME = null; showHome(); });
}
function homeAge() { return HOME && HOME.at ? (Date.now() - new Date(HOME.at).getTime()) / 60000 : 1e9; }
function showHome() {
  var el = $('indoor'), age = homeAge();
  if (!HOME || age > 12 * 60) { el.hidden = true; return; }   // nothing recent: hide the reading
  var t = new Date(HOME.at), when = age < 2 ? 'just now' : 'at ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
  el.className = age > 3 * 60 ? 'old' : '';                     // greyed out if older than 3 hours
  el.innerHTML = '<div class="lbl">Indoors 室內</div><div class="v num">' + icon('thermo', 40, 1.5) + HOME.temp.toFixed(1) + '°</div>' +
    '<div class="m">' + (typeof HOME.hum === 'number' ? 'Humidity ' + Math.round(HOME.hum) + '% · ' : '') + when + '</div>';
  el.hidden = false;
  bigFoot();
}
loadHome(); setInterval(loadHome, 5 * 60 * 1000); setInterval(showHome, 60 * 1000);

/* ---------- headlines (news.json is refreshed by the GitHub Action) ---------- */
var NEWS = [], newsAt = 0;
function loadNews() {
  fetch('news.json?t=' + Date.now()).then(function (r) { return r.json(); })
    .then(function (d) { NEWS = (d.items || []).filter(function (n) { return n.t; }); showNews(); })
    .catch(function () { if (!NEWS.length) $('nws').innerHTML = '<div class="nw"><span>新聞</span>暫時未有新聞</div>'; });
}
function showNews() {
  if (!NEWS.length) return;
  // Chinese headlines on the left, English on the right, 3 each, moving on every 15 seconds.
  var zh = NEWS.filter(function (n) { return n.lang !== 'en'; }), en = NEWS.filter(function (n) { return n.lang === 'en'; });
  function col(list, cls) {
    if (!list.length) return '<div class="ncol ' + cls + '"></div>';
    var out = '';
    for (var i = 0; i < 3 && i < list.length; i++) { var n = list[(newsAt * 3 + i) % list.length]; out += '<div class="nw"><span>' + esc(n.src) + '</span>' + esc(n.t) + '</div>'; }
    return '<div class="ncol ' + cls + '">' + out + '</div>';
  }
  $('nws').innerHTML = col(zh, 'zh') + col(en, 'en');
  newsAt++;
}
loadNews(); setInterval(loadNews, 30 * 60 * 1000); setInterval(showNews, 15000);

/* ---------- Cantonese spoken summary ---------- */
function brief() {
  var d = new Date(), h = d.getHours();
  var t = (h < 12 ? '早晨。' : h < 18 ? '午安。' : '晚安。') + (CONFIG.cityZh || '') + '而家係' + h + '點' + (d.getMinutes() ? d.getMinutes() + '分' : '正') + '。';
  if (W) {
    var c = W.current, dl = W.daily;
    t += '今日天氣' + wx(dl.weather_code[0], 1)[2] + '，而家' + r(c.temperature_2m) + '度，最高' + r(dl.temperature_2m_max[0]) + '度，最低' + r(dl.temperature_2m_min[0]) + '度，下雨機會百分之' + (dl.precipitation_probability_max[0] || 0) + '。';
    t += '聽日' + wx(dl.weather_code[1], 1)[2] + '，' + r(dl.temperature_2m_min[1]) + '至' + r(dl.temperature_2m_max[1]) + '度。';
  }
  if (HOME && homeAge() < 3 * 60) t += '屋企室內' + HOME.temp.toFixed(1).replace(/\.0$/, '') + '度' + (typeof HOME.hum === 'number' ? '，濕度百分之' + Math.round(HOME.hum) : '') + '。';
  if (CAL && !calSample) {
    var tk = dayKey(new Date()), ev = CAL.events.filter(function (e) { return dayKey(evDate(e.start)) === tk; });
    if (ev.length) t += '今日日程：' + ev.slice(0, 5).map(function (e) { var s = evDate(e.start); return (e.allDay ? '' : s.getHours() + '點' + (s.getMinutes() ? s.getMinutes() + '分' : '') + '，') + e.title; }).join('；') + '。';
  }
  if (NEWS.length) t += '新聞摘要。' + NEWS.filter(function (n) { return n.lang !== 'en'; }).slice(0, 6).map(function (n) { return n.src + '：' + n.t + '。'; }).join('');
  return t;
}
function voice() {
  var v = speechSynthesis.getVoices().filter(function (x) { return /zh[-_]HK|yue/i.test(x.lang); });
  return v[0] || null;
}
$('play').addEventListener('click', function () {
  var b = $('play');
  if (!window.speechSynthesis) { b.textContent = '不支援'; return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); b.classList.remove('on'); b.textContent = '▶ 播放'; return; }
  var u = new SpeechSynthesisUtterance(brief());
  u.lang = 'zh-HK'; u.rate = 0.95; var v = voice(); if (v) u.voice = v;
  u.onend = u.onerror = function () { b.classList.remove('on'); b.textContent = '▶ 播放'; };
  b.classList.add('on'); b.textContent = '■ 停止';
  speechSynthesis.speak(u);
});

/* ---------- page 3: Premier League table ----------
   table.json is saved every hour by .github/workflows/table.yml (tools/build_table.py),
   so the iPad never has to reach the football site itself. */
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function loadTable() {
  fetch('table.json?t=' + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { if (d.rows && d.rows.length) showTable(d); else throw 0; })
    .catch(function () { if (!$('ltab').querySelector('.lcol')) $('lmsg').textContent = '暫時未有積分榜 · Table not available yet'; });
}
function showTable(d) {
  var rows = d.rows, n = rows.length, half = Math.ceil(n / 2), head = '<div class="lr hd"><span></span><span></span><span>CLUB</span><span class="n">P</span><span class="n">GD</span><span class="pts">PTS</span></div>';
  function col(list) {
    return '<div class="lcol">' + head + list.map(function (t) {
      var zone = t.pos <= 4 ? ' cl' : t.pos > n - 3 ? ' rel' : '';
      return '<div class="lr' + zone + '"><span class="pos">' + t.pos + '</span>' +
        (t.logo ? '<img class="bd" src="' + esc(t.logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '<span></span>') +
        '<span class="nm">' + esc(t.name) + '</span><span class="n">' + t.p + '</span><span class="n">' + (t.gd > 0 ? '+' : '') + t.gd + '</span><span class="pts">' + t.pts + '</span></div>';
    }).join('') + '</div>';
  }
  $('ltab').innerHTML = col(rows.slice(0, half)) + col(rows.slice(half));
  var at = d.saved ? new Date(d.saved) : null;
  var yr = /\d{4}[-\/]\d{2,4}/.exec(d.season || '');
  $('lupd').textContent = (yr ? yr[0] + ' · ' : '') + (at && !isNaN(at) ? 'Updated ' + at.getDate() + ' ' + MONTHS[at.getMonth()].slice(0, 3) + ' ' + pad(at.getHours()) + ':' + pad(at.getMinutes()) : '');
}
loadTable(); setInterval(loadTable, 30 * 60 * 1000);

/* ---------- warm-up button ----------
   A web page can't change Apple Home itself, so the button runs the
   "Warm Up Home" Shortcut, which sets every heater to the warm temperature. */
var heatSent = 0;
function heatShow() {
  var el = $('heat'), h = CONFIG.heat;
  if (!h || !h.shortcut) { el.hidden = true; return; }
  var recent = Date.now() - heatSent < 10 * 60 * 1000;
  el.className = recent ? 'sent' : '';
  el.innerHTML = icon('flame', 30, 2) + (recent ? '已開暖氣 ' + h.temp + '° <small>Heating on</small>' : '暖氣 ' + h.temp + '° <small>Warm up</small>');
}
$('heat').onclick = function (e) {
  e.preventDefault();
  heatSent = Date.now(); heatShow();
  location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(CONFIG.heat.shortcut);
};
heatShow(); setInterval(heatShow, 60 * 1000);

/* Reload every 6 hours so the page stays fresh and light. */
setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
</script>
</body>
</html>
