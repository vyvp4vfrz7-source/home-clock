name: Update Waterstones bestsellers
on:
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * 1"   # Mondays, before the YouTube review search
  push:
    paths:
      - tools/build_waterstones.py
      - .github/workflows/bestsellers.yml
permissions:
  contents: write
concurrency: site-data
jobs:
  ws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_waterstones.py
      - run: pip install -q pillow && python3 tools/build_books.py
      - run: python3 tools/build_bookvids.py
      - name: Commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "book-bot"
          git config user.email "book-bot@users.noreply.github.com"
          git add bestsellers.json books bookvids.json
          git diff --cached --quiet || (git commit -m "Update Waterstones bestsellers" && git pull --rebase && git push)
