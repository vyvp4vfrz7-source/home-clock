name: Save photo note
# Tapping a photo on the dashboard sends repository_dispatch "photo-note"
# with client_payload {"photo": "<photo id>", "who": "...", "text": "..."}.
on:
  repository_dispatch:
    types: [photo-note]
  workflow_dispatch:
    inputs:
      photo: { description: "Photo id (file name in photos/ without .jpg)", required: true }
      who: { description: "Who", required: false }
      text: { description: "Note", required: false }
      delete: { description: "Type 1 to remove all notes on this photo", required: false }
permissions:
  contents: write
concurrency: site-data
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/save_note.py
        env:
          PHOTO: ${{ github.event.client_payload.photo || inputs.photo }}
          WHO: ${{ github.event.client_payload.who || inputs.who }}
          TEXT: ${{ github.event.client_payload.text || inputs.text }}
          DELETE: ${{ inputs.delete }}
      - name: Commit
        run: |
          git config user.name "note-bot"
          git config user.email "note-bot@users.noreply.github.com"
          git add notes.json
          git diff --cached --quiet || (git commit -m "Add photo note" && git pull --rebase && git push)
