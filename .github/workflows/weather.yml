name: Save weather copy
on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: site-data
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_weather.py weather.json
      - run: python3 tools/build_cities.py cities.json   # London + Birmingham + Hong Kong for the two-city page
        continue-on-error: true
      - run: python3 tools/build_tfl.py tfl.json   # TfL line status + Northwood trains (fallback for the TfL page)
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json; for f in cities.json tfl.json; do [ -f $f ] && git add $f; done; true
          git diff --cached --quiet || (git commit -m "Update weather" && git pull --rebase && git push)
