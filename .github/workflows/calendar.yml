name: Save calendar
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: site-data
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - run: python tools/build_calendar.py calendar.json
        env:
          CALENDAR_ICS: ${{ secrets.CALENDAR_ICS }}
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || (git commit -m "Update calendar" && git pull --rebase && git push)
