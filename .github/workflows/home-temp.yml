name: Save home temperature
# The "Send home temp" Shortcut calls the GitHub API (repository_dispatch, event "home-temp")
# with client_payload {"temp": "...", "hum": "..."}. Run it by hand from the Actions tab to test.
on:
  repository_dispatch:
    types: [home-temp]
  workflow_dispatch:
    inputs:
      temp: { description: "Temperature °C", required: true, default: "21.5" }
      hum: { description: "Humidity % (optional)", required: false }
permissions:
  contents: write
concurrency: site-data
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/save_home.py
        env:
          TEMP: ${{ github.event.client_payload.temp || inputs.temp }}
          HUM: ${{ github.event.client_payload.hum || inputs.hum }}
      - name: Commit
        run: |
          git config user.name "home-bot"
          git config user.email "home-bot@users.noreply.github.com"
          git add home.json
          git diff --cached --quiet || (git commit -m "Update home temperature" && git pull --rebase && git push)
