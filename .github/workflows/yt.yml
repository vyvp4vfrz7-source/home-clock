name: Save YouTube news videos
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [claude/project-thread-qxro28]
    paths: [tools/build_yt.py, .github/workflows/yt.yml]
permissions:
  contents: write
concurrency: site-data
jobs:
  yt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_yt.py yt.json
      - run: head -c 3000 yt.json || true
      - name: Commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add yt.json
          git diff --cached --quiet || (git commit -m "Update YouTube news" && git pull --rebase && git push)
