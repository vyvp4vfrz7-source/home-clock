name: Find YouTube book reviews
on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 1"   # Mondays
  push:
    paths:
      - books.json
      - bestsellers.json
      - tools/build_bookvids.py
      - .github/workflows/bookvids.yml
permissions:
  contents: write
concurrency: site-data
jobs:
  vids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_bookvids.py
      - name: Commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "book-bot"
          git config user.email "book-bot@users.noreply.github.com"
          git add bookvids.json
          git diff --cached --quiet || (git commit -m "Update book review videos" && git pull --rebase && git push)
