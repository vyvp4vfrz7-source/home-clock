name: Probe HK sources (temporary)
on:
  push:
    branches: [claude/project-thread-skkr2e]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; H=https://www.hko.gov.hk
          for l in cp1 vpb hko hk2 cch dnl pe2 wlp wgl wl2 tpk skg sk2 cce klt lfs cwa cwb lam swh tms ic1 sly kfb tko ssp vpa vpc lkf stc ngp; do
            C=$(echo $l | tr a-z A-Z)
            code=$(curl -sS -m 12 -o out/$l.jpg -w "%{http_code}" "$H/wxinfo/aws/hko_mica/$l/latest_$C.jpg")
            t=$(curl -sS -m 12 "$H/tc/wxinfo/ts/webcam/${C}_photo.htm" | grep -oE '<title>[^<]*' | head -1)
            echo "$l $code $(stat -c%s out/$l.jpg 2>/dev/null) $t"
            [ "$code" = 200 ] || rm -f out/$l.jpg
          done
      - uses: actions/upload-artifact@v4
        with: { name: cams, path: out }
