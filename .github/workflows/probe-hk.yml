name: Probe HK sources (temporary)
on:
  push:
    branches: [claude/project-thread-skkr2e]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for v in jUtZv7pdJII r1VOcQ1xUN0 967IhnPdG_8 bNOWG3jcOlQ; do
            curl -sSL -m 20 -H "Accept-Language: en" "https://www.youtube.com/watch?v=$v" -o w.html
            echo "== $v $(grep -oE '"isLiveNow":(true|false)' w.html | head -1) $(grep -oE '"playableInEmbed":(true|false)' w.html | head -1) $(grep -oE '"status":"[A-Z_]+"' w.html | head -1) $(grep -oE '<title>[^<]{0,90}' w.html)"
          done
          curl -sS -m 20 "https://www.youtube.com/oembed?url=https://www.youtube.com/channel/UCNcY1o1xGgTX_19w0cXes9g/live&format=json" | head -c 300; echo
