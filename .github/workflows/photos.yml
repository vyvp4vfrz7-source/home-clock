name: Refresh family photos
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: site-data
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q opencc-python-reimplemented || true
      - run: ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python tools/build_photos.py
        env:
          ALBUM_TOKEN: ${{ secrets.ALBUM_TOKEN }}
      - name: Show what a test run made (runs from other branches don't commit)
        if: github.ref != 'refs/heads/main'
        run: ls -la photos | grep -i mp4 || echo "no videos"; grep -c '"video"' photos.json || true
      - name: Commit if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add -A photos photos.json places.json
          git diff --cached --quiet || (git commit -m "Update family photos" && git pull --rebase && git push)
