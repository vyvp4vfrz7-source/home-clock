name: Refresh family photos
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: site-data
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_photos.py
        env:
          ALBUM_TOKEN: ${{ secrets.ALBUM_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add -A photos photos.json
          git diff --cached --quiet || (git commit -m "Update family photos" && git pull --rebase && git push)
