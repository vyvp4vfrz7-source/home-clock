name: Refresh holidays
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/build_holidays.py, .github/workflows/holidays.yml]
permissions:
  contents: write
concurrency: site-data
jobs:
  holidays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_holidays.py holidays.json
      - name: Commit if changed
        run: |
          git config user.name "holiday-bot"
          git config user.email "holiday-bot@users.noreply.github.com"
          git add holidays.json
          git diff --cached --quiet || (git commit -m "Update holidays" && git pull --rebase && git push)
